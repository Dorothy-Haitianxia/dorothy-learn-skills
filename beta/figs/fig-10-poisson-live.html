  <figcaption>图 10 · 二项分布 B(n, 2/n) 随 n 增大逼近 Poisson(2)：拖动 n 看柱形逐步贴到虚线上（正文 §8.3 例 4）</figcaption>
  <script>
(function () {
  var SVG = document.getElementById('poiSvg');
  if (!SVG) return;
  var X0 = 84, DX = 64, BASE = 252, TOP = 56, KMAX = 8, SCALE = 0.30;
  function XS(k) { return X0 + k * DX; }
  function YS(p) { return BASE - Math.min(p, SCALE) / SCALE * (BASE - TOP); }
  function binom(n, k, p) {
    var v = Math.pow(1 - p, n);
    for (var i = 1; i <= k; i++) v = v * (n - i + 1) / i * p / (1 - p);
    return v;
  }
  function fact(k) { var f = 1; for (var i = 2; i <= k; i++) f *= i; return f; }
  function pois(k) { return Math.exp(-2) * Math.pow(2, k) / fact(k); }
  var grp = SVG.querySelector('g[data-bars]');
  var readN = SVG.querySelector('[data-read="n"]');
  var readGap = SVG.querySelector('[data-read="gap"]');
  function paint(n) {
    var p = 2 / n, k, h, gap = 0, d;
    while (grp.firstChild) grp.removeChild(grp.firstChild);
    for (k = 0; k <= KMAX; k++) {
      h = YS(binom(n, k, p));
      d = document.createElementNS(SVG.namespaceURI, "rect");
      d.setAttribute("class", "f-hl");
      d.setAttribute("x", (XS(k) - 17).toFixed(1));
      d.setAttribute("y", h.toFixed(1));
      d.setAttribute("width", "34");
      d.setAttribute("height", (BASE - h).toFixed(1));
      grp.appendChild(d);
      gap = Math.max(gap, Math.abs(binom(n, k, p) - pois(k)));
    }
    readN.textContent = "B(n, p)，n = " + n + "，p = " + p.toFixed(n > 50 ? 3 : 2);
    readGap.textContent = "MAX |BINOM − POISSON| = " + gap.toFixed(3);
  }
  var inp = document.querySelector('[data-ctl="poisson"] input[data-act="n"]');
  if (inp) inp.addEventListener("input", function () { paint(parseInt(inp.value, 10)); });
  paint(20);
})();
  </script>
