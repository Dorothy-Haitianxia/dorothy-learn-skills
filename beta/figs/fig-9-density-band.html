  <script>
(function () {
  var SVG = document.getElementById('densSvg');
  if (!SVG) return;
  var X0 = 60, X1 = 600, BASE = 246, TOP = 58;
  function XS(x) { return X0 + (x + 3.6) / 7.2 * (X1 - X0); }
  function YS(p) { return BASE - p / 0.42 * (BASE - TOP); }
  function norm(x) { return Math.exp(-x * x / 2) / Math.sqrt(2 * Math.PI); }
  function erf(x) {
    var s = x < 0 ? -1 : 1; x = Math.abs(x);
    var t = 1 / (1 + 0.3275911 * x);
    var y = 1 - ((((1.061405429 * t - 1.453152027) * t + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-x * x);
    return s * y;
  }
  var band = document.getElementById('densBand');
  var readP = SVG.querySelector('[data-read="prob"]');
  var readW = SVG.querySelector('[data-read="w"]');
  function paint(w) {
    var q = [], t;
    for (t = -w; t <= w + 1e-9; t += w / 40) q.push(XS(t).toFixed(1) + " " + YS(norm(t)).toFixed(1));
    band.setAttribute("d", "M" + XS(-w).toFixed(1) + " " + BASE + " L" + q.join(" L") + " L" + XS(w).toFixed(1) + " " + BASE + " Z");
    readP.textContent = "ℙ(−w ≤ X ≤ w) = " + erf(w / Math.SQRT2).toFixed(3);
    readW.textContent = "W = " + w.toFixed(2);
  }
  var inp = document.querySelector('[data-ctl="density"] input[data-act="w"]');
  if (inp) inp.addEventListener("input", function () { paint(parseInt(inp.value, 10) / 100); });
  paint(1);
})();
  </script>
